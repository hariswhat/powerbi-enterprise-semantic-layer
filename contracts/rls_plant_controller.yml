name: rls_plant_controller
description: A department-level grant sees only that department's cost centers. Manual (runbook section 4) - executeQueries resolves the impersonated user's real role membership, and the release's service principal cannot impersonate on an RLS model. Run it in DAX Studio or the service as a member of Cost Center Access.
measures: [Actual]
keys: ["Cost Center[Division]", "Cost Center[Department]"]
impersonate: plant.controller@northgate.example
manual: true
dax: |
  EVALUATE
  SUMMARIZECOLUMNS(
      'Cost Center'[Division],
      'Cost Center'[Department],
      "Actual", [Actual]
  )
sql: |
  SELECT
        cc.division AS "Cost Center[Division]"
      , cc.department AS "Cost Center[Department]"
      , SUM(f.amount_usd) AS "[Actual]"
  FROM fin.vw_fact_gl_actual AS f
  JOIN fin.vw_dim_cost_center AS cc ON cc.cost_center_key = f.cost_center_key
  JOIN fin.vw_security_cost_center AS s
    ON s.cost_center_key = f.cost_center_key
   AND s.user_principal_name = 'plant.controller@northgate.example'
  GROUP BY cc.division, cc.department
